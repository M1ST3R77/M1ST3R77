<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 322 36" role="img" aria-label="Open to internships from March 2027">
  <style>
    .ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      from { transform: scale(1); opacity: 0.7; }
      to   { transform: scale(2.6); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring { animation: none; opacity: 0; }
    }
  </style>
  <rect x="0.5" y="0.5" width="321" height="35" rx="17.5" fill="#0d1117" stroke="#30363d"/>
  <circle class="ring" cx="21" cy="18" r="5" fill="#3fb950"/>
  <circle cx="21" cy="18" r="5" fill="#3fb950"/>
  <text x="38" y="23" textLength="266" lengthAdjust="spacingAndGlyphs"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" fill="#e6edf3">Open to internships · from March 2027</text>
</svg>
