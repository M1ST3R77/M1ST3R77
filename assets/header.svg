<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Robin Biard</title>
  <desc id="desc">Terminal window. DevOps, Infrastructure, Cybersecurity, and a bit of everything on the side: AI, full-stack. 5th-year student at Epitech Paris, co-founder of Seeklon.</desc>

  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0.5" y="0.5" width="759" height="329" rx="12"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
    }
    .bar    { fill: #8b949e; font-size: 13px; }
    .prompt { fill: #3fb950; font-size: 16px; font-weight: 700; }
    .cmd    { fill: #e6edf3; font-size: 16px; }
    .name   { fill: url(#name); font-size: 30px; font-weight: 700; }
    .focus  { fill: #e6edf3; font-size: 18px; font-weight: 700; }
    .note   { fill: #8b949e; font-size: 14px; font-style: italic; }
    .out    { fill: #c9d1d9; font-size: 15px; }
    .hl     { fill: #58a6ff; font-weight: 700; }
    .dot    { fill: #484f58; }

    /* Everything is visible by default: the animations only delay the reveal,
       so the banner still reads correctly where animations do not run. */
    @keyframes type  { from { clip-path: inset(-25% 100% -25% 0); } to { clip-path: inset(-25% -5% -25% 0); } }
    @keyframes show  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

    .t1 { animation: type 0.4s steps(6, end) 0.3s both; }
    .o1 { animation: show 0.01s 0.9s both; }
    .s2 { animation: show 0.01s 1.3s both; }
    .t2 { animation: type 0.7s steps(13, end) 1.4s both; }
    .o2 { animation: show 0.01s 2.3s both; }
    .s3 { animation: show 0.01s 2.8s both; }
    .t3 { animation: type 0.7s steps(14, end) 2.9s both; }
    .o3 { animation: show 0.01s 3.8s both; }
    .s4 { animation: show 0.01s 4.2s both; }
    .cursor { animation: blink 1.1s step-end infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Window -->
  <g clip-path="url(#frame)">
    <rect width="760" height="330" fill="#0d1117"/>
    <ellipse cx="670" cy="60" rx="320" ry="210" fill="url(#glowBlue)"/>
    <ellipse cx="70" cy="340" rx="300" ry="180" fill="url(#glowPurple)"/>
    <rect width="760" height="40" fill="#161b22"/>
    <line x1="0" y1="40.5" x2="760" y2="40.5" stroke="#30363d"/>
  </g>
  <rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="none" stroke="#30363d"/>

  <!-- Title bar -->
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text class="bar" x="380" y="25" text-anchor="middle">robin@m1st3r77: ~</text>

  <!-- $ whoami -->
  <text class="prompt" x="28" y="80">$</text>
  <text class="cmd t1" x="48" y="80">whoami</text>
  <text class="name o1" x="28" y="120">Robin Biard</text>

  <!-- $ cat focus.txt -->
  <text class="prompt s2" x="28" y="162">$</text>
  <text class="cmd t2" x="48" y="162">cat focus.txt</text>
  <g class="o2">
    <text class="focus" x="28" y="192">DevOps <tspan class="dot">·</tspan> Infrastructure <tspan class="dot">·</tspan> Cybersecurity</text>
    <text class="note" x="28" y="215"># and a bit of everything on the side: AI, full-stack</text>
  </g>

  <!-- $ cat status.txt -->
  <text class="prompt s3" x="28" y="256">$</text>
  <text class="cmd t3" x="48" y="256">cat status.txt</text>
  <text class="out o3" x="28" y="284">5th-year student @ <tspan class="hl">Epitech Paris</tspan>  <tspan class="dot">·</tspan>  Co-founder @ <tspan class="hl">Seeklon</tspan></text>

  <!-- $ _ -->
  <g class="s4">
    <text class="prompt" x="28" y="314">$</text>
    <rect class="cursor" x="48" y="300" width="9" height="18" fill="#e6edf3"/>
  </g>
</svg>
